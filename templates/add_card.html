{% extends "base.html" %}

{% block content %}
<div class="add-card-container">
    <h2 class="card-title">Card Details for adding</h2>
    
    <div class="add-card-content">
        <div class="left-panel">
            <img src="{{ url_for('static', filename='images/card.png') }}" alt="Card Image" class="card-img">
        </div>

        <form id="add-card-form" class="right-panel" method="POST">
            <label for="card-number">Card number</label>
            <input type="text" id="card-number" name="card_number" placeholder="XXXX XXXX XXXX XXXX" maxlength="19" pattern="\d{13,19}" required>

            <label for="exp-date">Expiration date</label>
            <input type="text" id="exp-date" name="expiration" placeholder="MM/YYYY"
            pattern="(0[1-9]|1[0-2])\/20[2-9][0-9]" maxlength="7" required>

            <label for="cvv">CVV</label>
            <input type="text" id="cvv" name="cvv" placeholder="Required" maxlength="4" pattern="\d{3,4}" required>
            
            <label for="pin">Card PIN</label> 
            <input type="password" id="pin" name="pin" placeholder="Choose a secret PIN" maxlength="6" minlength="4" required>


            <label for="holder">Cardholder’s name</label>
            <input type="text" id="holder" name="holder_name" value="{{ first_name }} {{ last_name }}" readonly>

            <label for="address">Billing address</label>
            <input type="text" id="address" name="billing_address" placeholder="Your billing address" required>

            <button type="submit" class="save-btn">Save</button>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/add_card.js') }}"></script>
{% endblock %}
