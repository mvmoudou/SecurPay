<!-- signup_modal.html -->
<div class="modal-wrapper">
    <div class="modal-card">
      <span class="close-signup-btn">&times;</span>
      <div class="card">
        <div class="form-section">
          <h1 class="title">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="logo" class="icon">PaySecurApp
          </h1>
          <h2>Sign Up on PaySecurApp</h2>
  
          <form method="POST" action="/signup-modal" id="signup-form">
            <div class="form-group">
              <label for="last_name">Last name:</label>
              <input type="text" name="last_name" id="last_name" required>
            </div>
  
            <div class="form-group">
              <label for="first_name">First name:</label>
              <input type="text" name="first_name" id="first_name" required>
            </div>
  
            <div class="form-group select-group">
              <label for="gender">Gender:</label>
              <div class="select-container" id="select-toggle">
                <select name="gender" id="gender" required>
                  <option value="" disabled selected>-- Select gender --</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                </select>
                <button type="button" class="arrow-button" id="arrow-btn" aria-label="Toggle gender">
                  <span class="arrow-icon" id="arrow">&#9654;</span>
                </button>
              </div>
            </div>
  
            <div class="form-group">
              <label for="birthday">Birthday:</label>
              <input type="date" name="birthday" id="birthday" required>
            </div>
  
            <div class="form-group">
              <label for="email">Email:</label>
              <input type="email" name="email" id="email" required>
            </div>
  
            <div class="form-group">
              <label for="phone">Phone:</label>
              <input type="tel" name="phone" id="phone" required>
            </div>
  
            <div class="form-group">
              <label for="username">User name:</label>
              <input type="text" name="username" id="username" required>
            </div>
  
            <div class="form-group">
              <label for="password">Password:</label>
              <input type="password" name="password" id="password" required>
            </div>
  
            <div class="form-group">
              <label for="biometrics">Biometrics:</label>
              <button type="button" id="biometrics-btn">
                <img src="{{ url_for('static', filename='images/camera-icon.png') }}" alt="camera">
              </button>
            </div>
  
            <!-- Conditions d'utilisation -->
            <div class="form-group cgu-group" id="form-group-cgu">
              <span>Accept terms and conditions</span>
              <input type="checkbox" id="accept-checkbox" name="accept_cgu">
              <a href="/terms?from=signup" class="link-button" id="read-terms">Read terms and conditions</a>
            </div>
  
            <input type="hidden" name="terms_accepted" id="terms_accepted" value="">
  
            <!-- Zone d'aperçu vidéo -->
            <div id="camera-preview" class="video-container">
              <video id="video" autoplay></video>
              <p id="capture-status">Veuillez bien vous positionner...</p>
            </div>
  
            <div class="buttons">
              <button type="button" onclick="document.getElementById('signup-modal').style.display='none'" id="back-signup">Back</button>
              <button type="submit">Sign Up</button>
            </div>
          </form>
        </div>
        <div class="illustration">
          <img src="{{ url_for('static', filename='images/illustration.png') }}" alt="illustration">
        </div>
      </div>
    </div>
  </div>
