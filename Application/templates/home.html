<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Home - PaySecurApp</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <nav class="navbar">
      <div class="logo">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="logo">
        <span>PaySecurApp</span>
      </div>
      <ul class="nav-links">
        <li><a href="/home2" class="{% if active_page == 'home' %}active{% endif %}">Home</a></li>
        <li><a href="/features">Features</a></li>
        <li><a href="/security">Security</a></li>
        <li><a href="/team">Team</a></li>
        <li><a href="/login" id="open-login">Log In</a></li>
        <li><a href="/signup" id="open-signup">Sign Up</a></li>
      </ul>
    </nav>

    <main class="welcome-section">
      <h1 class="app-name">PaySecurApp</h1>
      <p class="slogan">
        Enjoy smooth and secure payments with next-gen facial recognition — your face is your password!
      </p>
    </main>
  </div>

  <!-- Modal container for signup -->
  <div id="signup-modal" class="modal" style="display: none;">
      <div class="modal-content" id="signup-modal-content"></div>
  </div>

  <!-- Modal container for login -->
  <div id="login-modal" class="login-modal" style="display: none;">
      <div class="login-content" id="login-modal-content"></div>
  </div>

  <!-- Charger le fichier JavaScript -->
  <script src="{{ url_for('static', filename='js/home.js') }}"></script>
</body>
</html>
