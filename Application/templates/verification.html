<div id="pin-verification-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content pin-verification">
      <h2 class="title"><i class="bi bi-shield-lock-fill"></i> Verify Your Identity</h2>
  
      <label class="code-label">Enter the code sent to your email :</label>
      <div class="code-inputs" id="code-inputs">
        {% for i in range(6) %}
        <input type="text" maxlength="1" class="code-box" inputmode="numeric" />
        {% endfor %}
      </div>
  
      <p id="resend-message">Didn’t receive a code? <span id="resend-text">Resend in 30s</span></p>
  
      <div class="numpad">
        {% for row in [[1,2,3],[4,5,6],[7,8,9],['',0,'']] %}
        <div class="numpad-row">
          {% for digit in row %}
          {% if digit != '' %}
          <button class="num-btn" onclick="addDigit(this)">{{ digit }}</button>
          {% else %}
          <button class="num-btn empty" disabled></button>
          {% endif %}
          {% endfor %}
        </div>
        {% endfor %}
      </div>
  
      <div class="pin-actions">
        <button class="back-btn" onclick="closePINVerificationModal()">Back</button>
        <button class="verify-btn" onclick="submitPINVerification()">Verify</button>
      </div>
  
      <p class="error-message" id="pin-error-msg" style="display:none;">Invalid code. Please try again</p>
    </div>
  </div>

<div id="pin-popup-modal" class="modal-overlay" style="display: none;">
  <div class="modal-content pin-popup">
    <h2 class="title">Code PIN</h2>
    <p class="pin-display"><span id="pin-value">••••••</span></p>
    <div class="progress-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>
    <p id="countdown">10</p>
  </div>
</div>
